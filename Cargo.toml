[workspace]
members = [
    "crates/nnrp-conformance-fixtures",
    "crates/nnrp-conformance-runner",
]
resolver = "2"

[workspace.package]
edition = "2024"
repository = "https://github.com/NagareWorks/nnrp-conformance"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.38", features = ["derive"] }
nnrp-conformance = { git = "https://github.com/NagareWorks/nnrp-rs.git", rev = "a00b77af4e13fc5a21473f6c90a288bd3d248fc7" }
nnrp-core = { git = "https://github.com/NagareWorks/nnrp-rs.git", rev = "a00b77af4e13fc5a21473f6c90a288bd3d248fc7" }
nnrp-runtime = { git = "https://github.com/NagareWorks/nnrp-rs.git", rev = "a00b77af4e13fc5a21473f6c90a288bd3d248fc7" }
nnrp-transport-quic = { git = "https://github.com/NagareWorks/nnrp-rs.git", rev = "a00b77af4e13fc5a21473f6c90a288bd3d248fc7" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "time"] }
