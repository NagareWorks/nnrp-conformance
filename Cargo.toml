[workspace]
members = [
    "crates/nnrp-conformance-fixtures",
    "crates/nnrp-conformance-runner",
]
resolver = "2"

[workspace.package]
edition = "2024"
repository = "https://github.com/NagareWorks/nnrp-conformance"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
clap = { version = "4.5.38", features = ["derive"] }
nnrp-conformance = { git = "https://github.com/NagareWorks/nnrp-rs.git", rev = "df41c6759d49918e77412dcf7d47fc839bfff6cd" }
nnrp-core = { git = "https://github.com/NagareWorks/nnrp-rs.git", rev = "df41c6759d49918e77412dcf7d47fc839bfff6cd" }
nnrp-runtime = { git = "https://github.com/NagareWorks/nnrp-rs.git", rev = "df41c6759d49918e77412dcf7d47fc839bfff6cd" }
nnrp-transport-ipc = { git = "https://github.com/NagareWorks/nnrp-rs.git", rev = "df41c6759d49918e77412dcf7d47fc839bfff6cd" }
nnrp-transport-provider = { git = "https://github.com/NagareWorks/nnrp-rs.git", rev = "df41c6759d49918e77412dcf7d47fc839bfff6cd" }
nnrp-transport-quic = { git = "https://github.com/NagareWorks/nnrp-rs.git", rev = "df41c6759d49918e77412dcf7d47fc839bfff6cd" }
nnrp-transport-tcp = { git = "https://github.com/NagareWorks/nnrp-rs.git", rev = "df41c6759d49918e77412dcf7d47fc839bfff6cd" }
nnrp-transport-websocket = { git = "https://github.com/NagareWorks/nnrp-rs.git", rev = "df41c6759d49918e77412dcf7d47fc839bfff6cd" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "time"] }
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
